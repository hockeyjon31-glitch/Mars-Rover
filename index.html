    <script>
      // Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function () {
        try {
          var root = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : null;
          if (root) {
            var activeFetch = typeof root.fetch === 'function' ? root.fetch.bind(root) : root.fetch;
            Object.defineProperty(root, 'fetch', {
              get: function () {
                return activeFetch;
              },
              set: function (fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return activeFetch;
                  },
                  set: function (fn) {
                    activeFetch = fn;
                  },
                  configurable: true,
                  enumerable: true,
                });
              } catch (_) {}
            }
          }
        } catch (_) {}
      })();
    </script>
